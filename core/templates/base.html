{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корочки.есть</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        :root {
            --bg-color: #f3f4f6;
            --text-color: #111827;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #ccc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #e5e7eb;
            --glass-bg: rgba(30, 30, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --input-bg: rgba(40, 40, 40, 0.8);
            --input-border: #444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Адаптивный контейнер под любые экраны */
        .container {
            width: 95%;
            max-width: 1100px;
            padding: 15px 0;
            flex-grow: 1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        nav {
            width: 95%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            margin-top: 15px;
            border-radius: 16px;
            position: sticky;
            top: 15px;
            z-index: 50;
        }

        .nav-logo {
            font-weight: bold;
            font-size: 1.3rem;
            text-decoration: none;
            color: var(--text-color);
            tracking-content: 1px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        button, .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            text-align: center;
            display: inline-block;
            text-decoration: none;
        }

        button:hover, .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .error {
            color: #ef4444;
            font-size: 0.8rem;
            display: block;
            margin-top: -12px;
            margin-bottom: 12px;
        }

        /* Центрирование узких форм (авторизация/регистрация) на ПК */
        .auth-box {
            max-width: 450px;
            margin: 30px auto;
        }

        /* Адаптивный Слайдер */
        .slider-container {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .slider-btn.prev {
            left: 15px;
        }

        .slider-btn.next {
            right: 15px;
        }

        /* Адаптивная сетка для карточек заявок на ПК */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--input-border);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .status-badge {
            font-weight: bold;
            color: var(--accent);
        }

        /* Медиа-запросы для мобильных устройств (до 600px) */
        @media (max-width: 600px) {
            nav, .container {
                max-width: 390px;
            }

            nav {
                padding: 10px 15px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            .slider-container {
                height: 160px;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .glass-panel {
                padding: 15px;
            }
        }
    </style>
</head>
<body class="dark-theme">
<nav class="glass-panel">
    <a href="{% url 'my_applications' %}" class="nav-logo">Корочки.есть</a>
    <div class="nav-links">
        <button id="theme-toggle" class="theme-btn">🌓</button>
        {% if request.user.is_authenticated %}
        {% if request.user.username == 'Admin' %}
        <a href="{% url 'admin_panel' %}">Панель управления</a>
        {% else %}
        <a href="{% url 'create_application' %}">Заявка</a>
        <a href="{% url 'my_applications' %}">Мои заявки</a>
        {% endif %}
        <a href="{% url 'logout' %}" style="color: #ef4444; font-weight: 600;">Выход</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    <div class="slider-container glass-panel" style="padding: 0;">
        <img src="{% static 'images/slide1.jpg' %}" class="slide active" alt="Слайд 1">
        <img src="{% static 'images/slide2.jpg' %}" class="slide" alt="Слайд 2">
        <img src="{% static 'images/slide3.jpg' %}" class="slide" alt="Слайд 3">
        <button class="slider-btn prev" id="prev-slide">&#10094;</button>
        <button class="slider-btn next" id="next-slide">&#10095;</button>
    </div>

    {% block content %}{% endblock %}
</div>

<script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
    });

    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;

    function showSlide(idx) {
        slides.forEach(s => s.classList.remove('active'));
        slides[idx].classList.add('active');
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }

    document.getElementById('next-slide').addEventListener('click', nextSlide);
    document.getElementById('prev-slide').addEventListener('click', prevSlide);
    setInterval(nextSlide, 4000);
</script>
</body>
</html>
