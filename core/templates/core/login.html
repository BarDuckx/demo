{% extends 'base.html' %}
{% block content %}
<div class="glass-panel auth-box">
    <h2 style="margin-bottom: 20px; text-align: center;">Авторизация</h2>
    {% if error %}
    <span class="error" style="text-align: center; display: block;">{{ error }}</span>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label class="form-label">Логин</label>
        <input type="text" name="username" required>

        <label class="form-label">Пароль</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="{% url 'register' %}" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Еще не
            зарегистрированы? Создать аккаунт</a>
    </div>
</div>
{% endblock %}
