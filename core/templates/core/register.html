{% extends 'base.html' %}
{% block content %}
<div class="glass-panel auth-box">
    <h2 style="margin-bottom: 20px; text-align: center;">Регистрация</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <span class="error">{{ field.errors.0 }}</span>
        {% endif %}
        {% endfor %}
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="{% url 'login' %}" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Уже есть
            аккаунт? Войти</a>
    </div>
</div>
{% endblock %}
